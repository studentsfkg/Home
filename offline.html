
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Offline – FKG Students</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #0b1020;
      color: #f5f7ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }
    main {
      max-width: 420px;
      padding: 35px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 24px;
      background: #111a2d;
    }
    h1 { font-size: 27px; }
    p { color: #a4b0c7; line-height: 1.7; }
    a {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 20px;
      border-radius: 12px;
      background: #4f83f1;
      color: white;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>Du bist gerade offline.</h1>
    <p>
      FKG Students kann diese Seite momentan nicht laden.
      Prüfe deine Internetverbindung und versuche es erneut.
    </p>
    <a href="/">Erneut versuchen</a>
  </main>
</body>
</html>
